# Despliegue de produccion. Separado del docker-compose.yml de desarrollo a
# proposito: aquel monta el codigo fuente como volumen, publica la base de
# datos en el anfitrion y arranca el servidor de desarrollo de Vite. Mezclar
# ambos en un fichero con perfiles habria dejado esas comodidades a una
# variable de entorno de distancia de acabar en produccion.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requiere un .env con DB_PASSWORD y JWT_SECRET. No hay valores por defecto
# para los secretos: es preferible que el arranque falle a que un despliegue
# quede protegido por una contrasena de ejemplo.

# Nombre de proyecto propio. Sin el, Compose lo deduce del directorio y este
# despliegue compartiria red, nombres de contenedor y —lo grave— el volumen
# pgdata con el de desarrollo: levantar produccion en la misma maquina
# arrancaria contra la base de datos de pruebas sin avisar de nada.
name: splitfair-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-expense_split}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    # Sin "ports": la base solo es alcanzable desde la red interna de Compose.
    # Publicarla en el anfitrion la expondria a internet en cualquier maquina
    # sin cortafuegos, que es como acaban filtrandose la mayoria.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-expense_split}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
    # Tampoco se publica. Solo nginx lo alcanza, y de ahi que el backend pueda
    # fiarse de la cabecera X-Forwarded-For para contar los intentos de login:
    # si el puerto estuviera abierto, cualquiera podria falsificarla y saltarse
    # el limite. Ver application-prod.yml y ProxyRateLimitTest.
    expose:
      - "8080"
    # Sonda de "listo", no de "vivo": responde 503 mientras Flyway migra o la
    # base no esta accesible. Con la de vivo bastaria con que la JVM
    # respondiera, y nginx empezaria a mandarle trafico a una instancia que
    # todavia no puede atenderlo.
    #
    # start_period cubre los ~25 segundos de arranque. Sin el, el contenedor
    # se marca como enfermo mientras arranca con toda normalidad, y el
    # frontend que espera a que este sano no llegaria a arrancar nunca.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      # service_healthy y no la forma corta: esta solo espera a que el
      # contenedor arranque, y nginx resolveria "backend" contra un proceso
      # que aun no escucha. Las primeras peticiones responderian 502.
      backend:
        condition: service_healthy
    # Unico puerto publicado de todo el despliegue. La aplicacion y la API
    # comparten origen, asi que no hace falta abrir nada mas.
    #
    # El 80 es para pruebas locales de la imagen. En un despliegue real, delante
    # va el terminador de TLS del proveedor: el perfil prod marca la cookie del
    # refresh token como Secure y por HTTP plano el navegador no la enviaria,
    # con lo que la sesion se caeria a los 15 minutos sin dar ningun error.
    ports:
      - "${HTTP_PORT:-80}:8080"
    # 127.0.0.1 y no "localhost": dentro del contenedor localhost resuelve
    # primero a ::1, nginx escucha solo en IPv4 y el wget de busybox no
    # reintenta por IPv4. La sonda daba "connection refused" con el servidor
    # sirviendo perfectamente. Se usa la forma explicita tambien en el backend,
    # donde hoy funciona por casualidad: la JVM si atiende en ambas pilas.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
