server:
  port: 8080

spring:
  application:
    name: expense-split

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_split}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Desactivado a proposito. open-in-view mantiene la sesion de Hibernate
    # abierta durante toda la peticion, lo que enmascara las cargas perezosas
    # accidentales: en vez de fallar, disparan consultas silenciosas fuera de
    # transaccion. Con la sesion cerrada, cualquier navegacion perezosa no
    # prevista falla en desarrollo en vez de degradar el rendimiento en
    # produccion.
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway, no Hibernate. "validate" hace que la
      # aplicacion se niegue a arrancar si las entidades y las tablas han
      # divergido, en vez de descubrirlo en produccion con una consulta rota.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Agrupa los INSERT/UPDATE en lotes. Importante al guardar un gasto
          # con sus N splits: pasa de N+1 viajes a la base a unos pocos.
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Si una migracion ya aplicada cambia de contenido, Flyway aborta en vez
    # de continuar en silencio con un esquema que ya no corresponde al script.
    validate-on-migrate: true

jwt:
  # Obligatorio y sin valor por defecto, para no versionar un secreto.
  # Minimo 32 bytes: se valida al arrancar, no en la primera peticion.
  secret: ${JWT_SECRET}

  # Ventana corta a proposito: el access token no se puede revocar, asi que
  # su validez es el tiempo maximo que sobrevive una credencial robada.
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutos

  # El refresh token si es revocable, de ahi que pueda durar mucho mas.
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

app:
  # Moneda de los grupos que no indican una al crearse.
  default-currency: ${DEFAULT_CURRENCY:USD}

  # URL publica del frontend: se usa para construir los links de invitacion.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  auth:
    # Cookie del refresh token. Se configura por entorno porque en desarrollo
    # el frontend habla por HTTP plano (localhost:5173 -> localhost:8080) y
    # una cookie Secure no llegaria a enviarse nunca.
    #
    # SameSite=Lax basta en desarrollo: los puertos no cuentan para SameSite,
    # asi que ambos son el mismo sitio. En produccion se endurece a Strict.
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:refresh_token}
      # Solo /api/auth la necesita: el resto de la API va con Authorization.
      path: ${REFRESH_COOKIE_PATH:/api/auth}
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

  invitations:
    expiration-days: ${INVITATION_EXPIRATION_DAYS:7}

  rate-limit:
    # Cupos por ventana deslizante, aplicados por IP y por email a la vez.
    # El login es mas estricto: es el que se ataca por fuerza bruta.
    login-attempts: ${RATE_LIMIT_LOGIN_ATTEMPTS:5}
    login-window-minutes: ${RATE_LIMIT_LOGIN_WINDOW_MINUTES:15}
    register-attempts: ${RATE_LIMIT_REGISTER_ATTEMPTS:10}
    register-window-minutes: ${RATE_LIMIT_REGISTER_WINDOW_MINUTES:60}

  cors:
    # Configurable por entorno: en produccion no es localhost.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        # Lista explicita, no "*". Con el comodin, cada version de Spring Boot
        # que anada un endpoint nuevo lo publica sin que nadie lo decida:
        # /actuator/env y /actuator/configprops, por ejemplo, muestran la
        # configuracion entera, secretos incluidos.
        include: health,info,metrics,prometheus

  endpoint:
    health:
      # Explicito aunque sea el valor por defecto, porque es una decision de
      # seguridad: con detalles, la respuesta publica dice que base de datos
      # hay detras, su version y el espacio libre en disco. La sonda solo
      # necesita saber si esta arriba.
      show-details: never
      # Anade /actuator/health/liveness y /actuator/health/readiness. La
      # distincion importa al desplegar: "vivo" significa no reiniciarme,
      # "listo" significa ya puedes mandarme trafico. Confundirlos hace que
      # el orquestador enrute peticiones a una instancia que todavia esta
      # migrando el esquema.
      probes:
        enabled: true

logging:
  pattern:
    # Mete el identificador de peticion en todas las lineas de la consola.
    # Se engancha al patron por defecto de Spring Boot en vez de reescribirlo
    # entero, para no perder colores ni formato al actualizar de version.
    level: "%5p [%X{traceId:-........}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
