# Perfil de tests. La URL de la base la inyecta Testcontainers en tiempo de
# ejecucion via @DynamicPropertySource, por eso no aparece aqui.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        # Permite contar las consultas realmente ejecutadas y convertir
        # "creo que no hay N+1" en una asercion verificable.
        generate_statistics: true
  flyway:
    enabled: true

# Secreto ficticio, solo para que el contexto arranque en los tests.
# HS256 exige una clave de al menos 256 bits (32 bytes).
jwt:
  secret: clave-exclusiva-de-tests-no-usada-en-ningun-entorno-real-0123456789
  access-token-expiration-ms: 900000
  refresh-token-expiration-days: 30

app:
  # Cupos amplios por defecto: los tests de otras clases registran varios
  # usuarios desde la misma IP y no deben chocar con el limitador. La clase
  # que prueba el limite los reduce con @TestPropertySource.
  rate-limit:
    login-attempts: 1000
    login-window-minutes: 1
    register-attempts: 1000
    register-window-minutes: 1

  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
