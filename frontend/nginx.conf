# Configuracion del servidor que sirve la aplicacion compilada.
#
# La imagen base es nginx-unprivileged, que corre sin root y por eso escucha en
# el 8080 y no en el 80: los puertos por debajo del 1024 exigen privilegios.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Nada de anunciar la version exacta en cada respuesta y en cada pagina de
    # error: es informacion gratis para quien busque un exploit conocido.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------------
    # La API, en el mismo origen que la aplicacion
    # ---------------------------------------------------------------------
    # Esta es la decision central de esta configuracion y resuelve tres cosas
    # a la vez:
    #
    # 1. No hay CORS. El navegador ve un unico origen, asi que no hay
    #    peticiones de verificacion previa ni una lista de origenes permitidos
    #    que mantener sincronizada con el dominio de despliegue.
    # 2. La cookie del refresh token funciona con SameSite=Strict, que es lo
    #    que fuerza el perfil prod. Entre dominios distintos no viajaria.
    # 3. La URL de la API deja de quedar grabada en el build. Vite sustituye
    #    VITE_API_BASE_URL en tiempo de compilacion, asi que con una URL
    #    absoluta cada dominio necesitaria su propia imagen; con /api, la
    #    misma imagen sirve en cualquier sitio.
    location /api/ {
        # El destino se pasa por variable, y no como literal, por como resuelve
        # nombres nginx: con un literal resuelve "backend" una sola vez, al
        # arrancar, y se queda con esa IP para siempre. Si el contenedor del
        # backend se reinicia y Docker le asigna otra, nginx sigue enviando
        # trafico a una direccion muerta y todo responde 502 hasta que se
        # reinicia tambien nginx. Con la variable y el resolver, la resolucion
        # es en cada peticion y se recupera solo.
        #
        # 127.0.0.11 es el DNS interno de Docker; esta configuracion asume el
        # despliegue con Compose de docker-compose.prod.yml.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $destino http://backend:8080;

        # Sin parte de ruta en el destino, nginx reenvia la URI original tal
        # cual: /api/auth/login llega como /api/auth/login. Es lo que espera el
        # backend, que sirve toda la API bajo /api.
        proxy_pass $destino;
        proxy_http_version 1.1;
        # $http_host y no $host: el primero es la cabecera Host tal como llego,
        # con puerto incluido; el segundo la da sin puerto. La diferencia no es
        # cosmetica y costo un 403 en el navegador que curl no reproducia.
        #
        # El navegador envia Origin en todo POST, tambien cuando es al mismo
        # origen. Spring compara ese Origin con el suyo reconstruido: si no
        # coinciden, lo trata como peticion CORS y la rechaza con 403. Con
        # $host el backend se creia en "http://localhost" mientras la pagina
        # decia "http://localhost:8095", asi que login, registro y refresco
        # fallaban todos. Con el puerto, coinciden y no hay CORS que aplicar.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # Imprescindible, no decorativo: el backend limita los intentos de
        # login por IP. Sin esta cabecera —y sin
        # server.forward-headers-strategy=FRAMEWORK en el backend, que es
        # quien la interpreta— todas las peticiones llegarian con la IP de
        # este contenedor y el limite de 5 intentos cada 15 minutos pasaria a
        # ser de 5 para toda la aplicacion.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # ---------------------------------------------------------------------
    # Estaticos con hash en el nombre
    # ---------------------------------------------------------------------
    # Vite genera index-CsQ4I6H1.js: el contenido no cambia nunca sin cambiar
    # el nombre, asi que se puede cachear indefinidamente.
    location /assets/ {
        # Una sola cabecera, no dos. La directiva "expires" emite ya su propio
        # Cache-Control, asi que combinada con add_header la respuesta sale con
        # dos Cache-Control distintas y cual gana depende del cliente. Se
        # verifico con curl: llegaban "max-age=31536000" y "public, immutable"
        # por separado.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header no se hereda: en cuanto un location declara el suyo, los
        # del bloque server dejan de aplicarse. Por eso las cabeceras de
        # seguridad se repiten en cada bloque en vez de declararse una vez.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------------
    # La aplicacion
    # ---------------------------------------------------------------------
    location / {
        # Sin este try_files, recargar en /groups/3 devuelve 404: esa ruta solo
        # existe dentro del enrutador de React, no en el disco. Se sirve
        # siempre index.html y el enrutador decide.
        try_files $uri $uri/ /index.html;

        # index.html no se cachea nunca. Es el unico fichero sin hash, y una
        # copia vieja seguiria pidiendo assets cuyos hashes ya no existen: la
        # aplicacion se queda en blanco tras un despliegue y solo se arregla
        # vaciando la cache del navegador.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
